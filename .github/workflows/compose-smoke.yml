name: Compose Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/compose-smoke.yml"
      - "Dockerfile"
      - "apps/server/Dockerfile"
      - "apps/server/src/**"
      - "docker-compose.yml"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
      - "scripts/compose-smoke.sh"
      - "uv.lock"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/compose-smoke.yml"
      - "Dockerfile"
      - "apps/server/Dockerfile"
      - "apps/server/src/**"
      - "docker-compose.yml"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
      - "scripts/compose-smoke.sh"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: compose-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Production stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build, start, verify, and stop the stack
        run: ./scripts/compose-smoke.sh
